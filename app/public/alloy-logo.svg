<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 80" fill="none">
  <!-- Mascot Squircle (64x64 at 8,8) -->
  <g transform="translate(8, 8)">
    <rect width="64" height="64" rx="18" fill="#007FFF" />
    <path d="M8 18C8 12.4772 12.4772 8 18 8H46C51.5228 8 56 12.4772 56 18V23C56 17.4772 51.5228 13 46 13H18C12.4772 13 8 17.4772 8 23V18Z" fill="white" fill-opacity="0.18" />
    
    <!-- Character Body -->
    <ellipse cx="32" cy="34" rx="20.5" ry="19" fill="#FFFFFF" />
    <ellipse cx="32" cy="34" rx="17" ry="16" stroke="#E0F2FE" stroke-width="1.6" stroke-dasharray="2 3" />
    
    <!-- Left Eye Wink -->
    <path d="M23 31.5C24 29 27 29 28.5 31.5" stroke="#111827" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Eye Open with glint -->
    <ellipse cx="39" cy="31" rx="2.8" ry="3.5" fill="#111827" />
    <circle cx="40.2" cy="29.8" r="1.1" fill="#FFFFFF" />
    
    <!-- Blush -->
    <ellipse cx="20.5" cy="36" rx="2.6" ry="1.6" fill="#FF8A8A" fill-opacity="0.65" />
    <ellipse cx="43.5" cy="36" rx="2.6" ry="1.6" fill="#FF8A8A" fill-opacity="0.65" />
    
    <!-- Smile -->
    <path d="M28 36C29.6 39.2 34.4 39.2 36 36" stroke="#111827" stroke-width="2" stroke-linecap="round" />
    
    <!-- Gold Sparkle -->
    <path d="M48 16L49 19.5L52.5 20.5L49 21.5L48 25L47 21.5L43.5 20.5L47 19.5L48 16Z" fill="#FBBF24" />
  </g>

  <!-- Typographic Wordmark "alloy" -->
  <text x="86" y="52" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="36" fill="#111827" letter-spacing="-1.5">alloy</text>
  
  <!-- Azure Dot Accent -->
  <circle cx="178" cy="46" r="4.5" fill="#007FFF" />

  <!-- "BETA" Pill Badge -->
  <rect x="194" y="27" width="54" height="24" rx="12" fill="#F3F4F6" stroke="#E5E7EB" stroke-width="1.2" />
  <text x="221" y="43" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="10.5" fill="#6B7280" letter-spacing="1.5" text-anchor="middle">BETA</text>
</svg>
